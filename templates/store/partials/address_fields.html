<!-- Address fields partial used in checkout -->
<div class="sm:col-span-2">
  <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider block mb-1">Full Name</label>
  <input type="text" name="full_name" value="{{ user.get_full_name }}" required
         class="w-full h-12 border border-outline-variant/30 rounded-lg px-4 text-sm text-on-surface bg-white focus:outline-none focus:ring-2 focus:ring-primary/20">
</div>
<div>
  <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider block mb-1">Phone</label>
  <input type="tel" name="phone" required
         class="w-full h-12 border border-outline-variant/30 rounded-lg px-4 text-sm text-on-surface bg-white focus:outline-none focus:ring-2 focus:ring-primary/20">
</div>
<div>
  <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider block mb-1">House/Flat No.</label>
  <input type="text" name="house_no" required
         class="w-full h-12 border border-outline-variant/30 rounded-lg px-4 text-sm text-on-surface bg-white focus:outline-none focus:ring-2 focus:ring-primary/20">
</div>
<div class="sm:col-span-2">
  <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider block mb-1">Street / Area</label>
  <input type="text" name="street" required
         class="w-full h-12 border border-outline-variant/30 rounded-lg px-4 text-sm text-on-surface bg-white focus:outline-none focus:ring-2 focus:ring-primary/20">
</div>
<div>
  <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider block mb-1">City</label>
  <input type="text" name="city" required
         class="w-full h-12 border border-outline-variant/30 rounded-lg px-4 text-sm text-on-surface bg-white focus:outline-none focus:ring-2 focus:ring-primary/20">
</div>
<div>
  <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider block mb-1">State</label>
  <input type="text" name="state" required
         class="w-full h-12 border border-outline-variant/30 rounded-lg px-4 text-sm text-on-surface bg-white focus:outline-none focus:ring-2 focus:ring-primary/20">
</div>
<div>
  <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider block mb-1">PIN Code</label>
  <input type="text" name="pincode" required maxlength="6"
         class="w-full h-12 border border-outline-variant/30 rounded-lg px-4 text-sm text-on-surface bg-white focus:outline-none focus:ring-2 focus:ring-primary/20">
</div>
<div>
  <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider block mb-1">Address Type</label>
  <select name="address_type"
          class="w-full h-12 border border-outline-variant/30 rounded-lg px-4 text-sm text-on-surface bg-white focus:outline-none focus:ring-2 focus:ring-primary/20">
    <option value="Home">🏠 Home</option>
    <option value="Work">🏢 Work</option>
    <option value="Other">📍 Other</option>
  </select>
</div>
